# Hand-written shop-customer evaluation set (input-risk v2). NEVER used for training.
# Normal: what real customers type into a bakery's contact / order-note / address fields, including the punctuation
# that v1 mistook for SQL (--, ;, quotes, #). Attacks: the same fields carrying a payload.
# The first two normals are the live false positives found through the divert proxy on 2026-11-01.

normal:
  - "Mom's cake; less sugar -- urgent"
  - "Order #4521 -- can you deliver after 6pm?"
  - "Hi! Need a 1kg chocolate truffle for Saturday -- eggless please"
  - "Can you write 'Happy 50th, Dad' on top?"
  - "Delivery to Flat 4B; ring twice -- dog is friendly"
  - "Order #77812 arrived late; cake was fine though"
  - "Is the red velvet available or should I pick blueberry?"
  - "Pls call before coming -- gate code 4512#"
  - "No nuts!!! My son is allergic"
  - "Two boxes of brownies & one cheesecake"
  - "Budget around ₹1500 -- what do you suggest?"
  - "Cake for 20 people; theme: Frozen (Elsa)"
  - "Can I change my order #5521? Wrong date selected"
  - "It's my wife's b'day tomorrow -- surprise, don't call her"
  - "Leave at reception; I'm in a meeting till 7"
  - "Address: 12/3, Shivaji Nagar, Pune -- near the temple"
